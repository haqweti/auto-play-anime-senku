name: Предложить идею
description: Чего не хватает в скрипте, как его можно улучшить
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Связана ли идея с проблемой?
      description: Опишите, что сейчас неудобно или чего не хватает.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
      description: Как бы вы хотели это улучшить? (Например, новые кнопки, горячие клавиши и т.д.)
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы
      description: Рассматривали ли вы другие варианты?
    validations:
      required: false
